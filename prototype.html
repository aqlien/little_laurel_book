<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Book</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #112033;
      --muted: #64748b;
      --border: #dbe3ee;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }

    h1 { margin: 0 0 6px; font-size: 28px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 16px; }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }

    .toolbar input, .field input, .field textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    .primary {
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .primary:hover { background: var(--primary-dark); }

    .secondary {
      background: #e2e8f0;
      color: var(--text);
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }

    .panel h2 { margin-top: 0; font-size: 20px; }

    .form {
      display: none;
      gap: 12px;
      flex-direction: column;
    }

    .form.open { display: flex; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 600;
    }

    .field textarea { min-height: 80px; resize: vertical; }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .contact-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: #fbfdff;
    }

    .contact-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .contact-meta {
      color: var(--muted);
      margin-bottom: 2px;
      font-size: 14px;
    }

    .contact-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .empty {
      color: var(--muted);
      padding: 20px 0;
      text-align: center;
    }

    @media (max-width: 760px) {
      .content { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Address Book</h1>
      <p class="subtitle">A simple, easy-to-use contact list.</p>
    </header>

    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Search contacts" />
      <button id="addBtn" class="primary">Add Contact</button>
    </div>

    <div class="content">
      <section class="panel">
        <h2>Contacts</h2>
        <div id="contactList" class="contact-list"></div>
      </section>

      <section class="panel">
        <h2 id="formTitle">Add Contact</h2>
        <form id="contactForm" class="form">
          <div class="field">
            <label for="nameInput">Name</label>
            <input id="nameInput" required />
          </div>

          <div class="field">
            <label for="phoneInput">Phone</label>
            <input id="phoneInput" required />
          </div>

          <div class="field">
            <label for="emailInput">Email</label>
            <input id="emailInput" type="email" />
          </div>

          <div class="field">
            <label for="notesInput">Notes</label>
            <textarea id="notesInput"></textarea>
          </div>

          <div class="actions">
            <button type="submit" class="primary">Save</button>
            <button type="button" id="cancelBtn" class="secondary">Cancel</button>
          </div>
        </form>
      </section>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "simple-address-book";
    let contacts = [];
    let editingId = null;

    const searchInput = document.getElementById("searchInput");
    const contactList = document.getElementById("contactList");
    const contactForm = document.getElementById("contactForm");
    const formTitle = document.getElementById("formTitle");
    const addBtn = document.getElementById("addBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    const fields = {
      name: document.getElementById("nameInput"),
      phone: document.getElementById("phoneInput"),
      email: document.getElementById("emailInput"),
      notes: document.getElementById("notesInput")
    };

    function loadContacts() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        contacts = saved ? JSON.parse(saved) : [];
      } catch {
        contacts = [];
      }
    }

    function saveContacts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
    }

    function resetForm() {
      contactForm.reset();
      editingId = null;
      formTitle.textContent = "Add Contact";
      contactForm.classList.remove("open");
    }

    function openForm() {
      contactForm.classList.add("open");
    }

    function renderContacts() {
      const term = searchInput.value.trim().toLowerCase();
      const filtered = contacts.filter(contact => {
        const text = `${contact.name} ${contact.phone} ${contact.email} ${contact.notes}`.toLowerCase();
        return text.includes(term);
      });

      if (filtered.length === 0) {
        contactList.innerHTML = '<div class="empty">No contacts yet.</div>';
        return;
      }

      contactList.innerHTML = filtered.map(contact => `
        <div class="contact-card">
          <div class="contact-name">${contact.name}</div>
          <div class="contact-meta">Phone: ${contact.phone}</div>
          <div class="contact-meta">Email: ${contact.email || "—"}</div>
          <div class="contact-meta">Notes: ${contact.notes || "—"}</div>
          <div class="contact-actions">
            <button data-action="edit" data-id="${contact.id}">Edit</button>
            <button data-action="delete" data-id="${contact.id}">Delete</button>
          </div>
        </div>
      `).join("");
    }

    function saveContact(event) {
      event.preventDefault();

      const entry = {
        id: editingId || Date.now().toString(),
        name: fields.name.value.trim(),
        phone: fields.phone.value.trim(),
        email: fields.email.value.trim(),
        notes: fields.notes.value.trim()
      };

      if (!entry.name || !entry.phone) {
        alert("Please add a name and phone number.");
        return;
      }

      if (editingId) {
        contacts = contacts.map(contact => contact.id === editingId ? entry : contact);
      } else {
        contacts.unshift(entry);
      }

      saveContacts();
      renderContacts();
      resetForm();
    }

    function startEditing(id) {
      const contact = contacts.find(item => item.id === id);
      if (!contact) return;

      editingId = id;
      formTitle.textContent = "Edit Contact";
      fields.name.value = contact.name;
      fields.phone.value = contact.phone;
      fields.email.value = contact.email;
      fields.notes.value = contact.notes;
      openForm();
    }

    function handleListClick(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const id = button.getAttribute("data-id");
      const action = button.getAttribute("data-action");

      if (action === "edit") {
        startEditing(id);
      } else if (action === "delete") {
        contacts = contacts.filter(contact => contact.id !== id);
        saveContacts();
        renderContacts();
      }
    }

    addBtn.addEventListener("click", openForm);
    cancelBtn.addEventListener("click", resetForm);
    searchInput.addEventListener("input", renderContacts);
    contactForm.addEventListener("submit", saveContact);
    contactList.addEventListener("click", handleListClick);

    loadContacts();
    renderContacts();
  </script>
</body>
</html>
